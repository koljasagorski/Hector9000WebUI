# Doom settings for the Hector9000 kiosk (Chocolate Doom config format).
# Key values are DOS scan codes: 72/80/75/77 arrows, 29 Ctrl, 57 Space, 26/27 [ and ].
use_libsamplerate             0
force_software_renderer       0
# Keep 2000: with 0 the game starts but never advances (see README.md).
startup_delay                 2000
show_diskicon                 0
crispy_soundfix               1
grabmouse                     0
fullscreen                    0
sfx_volume                    8
music_volume                  0
show_messages                 1
key_right                     77
key_left                      75
key_up                        72
key_down                      80
key_strafeleft                51
key_straferight               52
key_fire                      29
key_use                       57
key_strafe                    56
key_speed                     54
key_strafe_alt                56
key_speed_alt                 54
key_prevweapon                26
key_nextweapon                27
key_fullscreen                33
use_mouse                     0
use_joystick                  0
joyb_speed                    29
screenblocks                  10
detaillevel                   0
snd_channels                  8
snd_musicdevice               0
snd_sfxdevice                 3
usegamma                      0
